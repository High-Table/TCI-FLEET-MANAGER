name: TCI Scrape

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: 'From date (DD-Mon-YYYY) - khali chhodo to pichla mahina use hoga'
        required: false
        default: ''
      to_date:
        description: 'To date (DD-Mon-YYYY) - khali chhodo to pichla mahina use hoga'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --break-system-packages -r requirements.txt

      - name: Run scraper and push to Firebase
        env:
          TCI_ACCOUNTS: ${{ secrets.TCI_ACCOUNTS }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
          FROM_DATE: ${{ github.event.inputs.from_date }}
          TO_DATE: ${{ github.event.inputs.to_date }}
        run: python3 actions_scraper.py

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            debug_*.png
            debug_*.html
            trip_link_error_*.png
            trip_table_error_*.png
          if-no-files-found: ignore
