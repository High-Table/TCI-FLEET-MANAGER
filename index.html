<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>TCI Fleet Manager</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#0f1117; --card:#1a1d27; --border:#2a2d3a;
    --accent:#4f8ef7; --accent2:#7c3aed; --green:#22c55e;
    --yellow:#eab308; --red:#ef4444; --text:#e2e8f0; --muted:#94a3b8;
    --header-h:56px;
  }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  header { position:fixed; top:0; left:0; right:0; height:var(--header-h); background:var(--card);
    border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 16px; z-index:100; gap:12px; }
  header h1 { font-size:1rem; font-weight:700; flex:1;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .status-bar { font-size:0.65rem; color:var(--muted); text-align:right; line-height:1.3; max-width:130px; }
  .status-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--green); margin-right:4px; }
  .status-dot.offline { background:var(--yellow); }
  .main { padding: calc(var(--header-h) + 12px) 12px 40px; max-width:1000px; margin:0 auto; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; }

  .tabs { display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tab { flex:0 0 auto; background:var(--card); border:1px solid var(--border); border-radius:8px;
    padding:8px 14px; font-size:0.8rem; cursor:pointer; white-space:nowrap; }
  .tab.active { border-color:var(--accent); background:var(--accent); color:#fff; }
  .section { display:none; }
  .section.active { display:block; }

  /* ── Account tabs (Manish/Suresh/etc) ── */
  .acc-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .acc-tab { background:var(--card); border:1px solid var(--border); border-radius:8px;
    padding:7px 14px; cursor:pointer; font-size:0.8rem; font-weight:600; }
  .acc-tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* ── Grand summary ── */
  .grand-summary { display:flex; gap:14px; flex-wrap:wrap; background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:12px 16px; margin-bottom:14px; font-size:0.78rem; color:var(--muted); }
  .grand-summary b { color:var(--text); font-size:0.88rem; }

  /* ── Vehicle tabs ── */
  .veh-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .veh-tab { background:var(--card); border:1px solid var(--border); border-radius:8px;
    padding:7px 12px; cursor:pointer; font-size:0.78rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  .veh-tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .veh-tab-count { background:rgba(255,255,255,0.15); border-radius:20px; padding:1px 7px; font-size:0.68rem; font-weight:700; }
  .veh-tab.active .veh-tab-count { background:rgba(255,255,255,0.25); }

  .vehicle-section { margin-bottom:16px; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--card); }
  .vehicle-header { display:flex; justify-content:space-between; align-items:center; padding:10px 14px;
    background:#1e2133; border-bottom:1px solid var(--border); gap:10px; }
  .vehicle-name { font-weight:700; font-size:0.88rem; }
  .vehicle-trip-count { background:rgba(79,142,247,0.15); color:var(--accent); border-radius:20px;
    padding:2px 10px; font-weight:700; font-size:0.72rem; }
  .vehicle-header-right { display:flex; align-items:center; gap:8px; }

  .icon-btn { background:rgba(255,255,255,0.08); border:1px solid var(--border); border-radius:7px;
    padding:6px 9px; cursor:pointer; font-size:0.72rem; color:var(--text); display:inline-flex; align-items:center; gap:4px; }
  .icon-btn:active { background:rgba(255,255,255,0.16); }

  /* Table always scrolls horizontally - same as laptop dashboard */
  .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .trip-table { width:100%; border-collapse:collapse; font-size:0.72rem; }
  .trip-table th { background:#171a29; padding:7px 8px; text-align:left; font-size:0.6rem;
    letter-spacing:0.02em; text-transform:uppercase; color:var(--muted); white-space:nowrap; border-bottom:1px solid var(--border); }
  .trip-table td { padding:7px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .trip-table tr:last-child td { border-bottom:none; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .total-row td { background:rgba(79,142,247,0.08); font-weight:700; border-top:1px solid var(--border); }

  .vi-table { width:100%; border-collapse:collapse; font-size:0.75rem; }
  .vi-table th { background:#171a29; padding:7px 8px; text-align:left; font-size:0.62rem;
    text-transform:uppercase; color:var(--muted); white-space:nowrap; border-bottom:1px solid var(--border); }
  .vi-table td { padding:7px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .exp-green { color: var(--green); font-weight: 600; }
  .exp-orange { color: #f97316; font-weight: 600; }
  .exp-red { color: var(--red); font-weight: 600; }
  .vi-actions { display:flex; gap:6px; }

  .add-vehicle-btn { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none;
    border-radius:8px; padding:9px 16px; font-weight:600; font-size:0.82rem; cursor:pointer; margin-bottom:14px; }

  /* ── Modal form (Add/Edit vehicle) ── */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:200;
    align-items:flex-start; justify-content:center; padding:40px 14px; overflow-y:auto; }
  .modal-overlay.active { display:flex; }
  .modal-box { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px;
    max-width:420px; width:100%; }
  .modal-box h3 { font-size:1rem; margin-bottom:14px; }
  .modal-box label { font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.02em;
    display:block; margin:10px 0 4px; }
  .modal-box input { width:100%; padding:9px 11px; background:#11141c; border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-size:0.88rem; }
  .modal-actions { display:flex; gap:10px; margin-top:18px; }
  .modal-actions button { flex:1; padding:10px; border:none; border-radius:8px; font-weight:600; cursor:pointer; font-size:0.85rem; }
  .btn-save { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
  .btn-cancel { background:rgba(255,255,255,0.08); color:var(--text); border:1px solid var(--border) !important; }
  .btn-delete-confirm { background:var(--red); color:#fff; }

  .login-box { max-width:340px; margin:30vh auto 0; padding:24px; }
  .login-box input { width:100%; padding:10px 12px; margin-bottom:10px; background:#11141c;
    border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:0.9rem; }
  .login-box button { width:100%; padding:10px; border:none; border-radius:8px; font-weight:600;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; cursor:pointer; }
  .msg { font-size:0.75rem; color:var(--muted); margin-top:8px; text-align:center; }
  .empty { color:var(--muted); font-size:0.85rem; text-align:center; padding:30px 10px; }

  /* ── Home page (Update Now + nav cards) ── */
  .update-btn { width:100%; background:#ec4899; color:#fff; border:none; border-radius:8px; height:48px;
    font-size:0.95rem; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px;
    margin-bottom:14px; cursor:pointer; }
  .update-btn:disabled { opacity:0.7; }
  .range-box { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:20px; }
  .range-fields { display:none; flex-direction:column; gap:8px; margin-top:10px; }
  .range-fields.show { display:flex; }
  .range-fields input { width:100%; padding:8px 10px; background:#11141c; border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-size:0.85rem; }
  .range-err { display:none; font-size:0.72rem; color:var(--red); }
  .range-err.show { display:block; }
  .nav-grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
  .nav-card { text-align:left; background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px 12px; display:flex; flex-direction:column; gap:10px; cursor:pointer; min-width:0; }
  .nav-card:active { background:#1e2133; }
  .nav-icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .nav-icon svg { width:20px; height:20px; }
  .nav-title { font-weight:600; font-size:0.85rem; }
  .nav-sub { font-size:0.68rem; color:var(--muted); margin-top:2px; }
  .footer-credit { text-align:center; font-size:0.7rem; color:var(--muted); padding-top:14px;
    border-top:1px solid var(--border); margin-top:10px; }
  .back-link { display:inline-block; margin-bottom:14px; cursor:pointer; }
</style>
</head>
<body>

<header>
  <h1>TCI Fleet Manager</h1>
  <div class="status-bar" id="statusBar"><span class="status-dot" id="statusDot"></span><span id="statusText">Loading...</span></div>
</header>

<div class="main">
  <!-- Login (one-time) -->
  <div id="loginBox" class="login-box card" style="display:none;">
    <div style="font-weight:700; margin-bottom:14px;">Sign in</div>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="doLogin()">Login</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- Data view -->
  <div id="dataView" style="display:none;">

    <!-- Home page -->
    <div id="homeView">
      <div class="nav-grid">
        <button class="nav-card" onclick="showSection('trips')">
          <div class="nav-icon" style="background:#a16207;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fef9c3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          </div>
          <div>
            <div class="nav-title">Trip Details</div>
            <div class="nav-sub">5 accounts</div>
          </div>
        </button>
        <button class="nav-card" onclick="showSection('vehicles')">
          <div class="nav-icon" style="background:#ffedd5;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
          </div>
          <div>
            <div class="nav-title">Vehicle Details</div>
            <div class="nav-sub">Docs and expiry</div>
          </div>
        </button>
      </div>

      <button id="updateBtn" class="update-btn" onclick="triggerUpdate()" style="margin-top:14px;">🔄 Update Now</button>

      <div class="range-box">
        <label style="display:flex; align-items:center; gap:8px; font-size:0.8rem; color:var(--muted);">
          <input type="checkbox" id="customRange" onchange="toggleRangeFields()"> Custom date range
        </label>
        <div id="rangeFields" class="range-fields">
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:0.72rem; color:var(--muted); width:34px;">From</span>
            <input type="date" id="fromDate">
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:0.72rem; color:var(--muted); width:34px;">To</span>
            <input type="date" id="toDate">
          </div>
          <div id="rangeErr" class="range-err">Dono dates bharo pehle</div>
        </div>
      </div>

      <div class="footer-credit">Designed by Manish Chaudhari</div>
    </div>

    <!-- Trip Details section -->
    <div id="section-trips" class="section">
      <div class="tab back-link" onclick="showHome()">← Back</div>
      <div class="acc-tabs" id="acc-tabs"></div>
      <div id="trip-table-wrap"></div>
    </div>

    <!-- Vehicle Details section -->
    <div id="section-vehicles" class="section">
      <div class="tab back-link" onclick="showHome()">← Back</div>
      <div id="vehicles-inner"></div>
    </div>
  </div>
</div>

<!-- Add/Edit Vehicle modal -->
<div class="modal-overlay" id="vehicleModal">
  <div class="modal-box">
    <h3 id="vehicleModalTitle">Add Vehicle</h3>
    <div id="vehicleFormFields"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeVehicleForm()">Cancel</button>
      <button class="btn-save" onclick="saveVehicle()">Save</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
const CACHE_KEY = 'tci_cached_data';
const ACC_KEYS_DEFAULT = ['MA','SA','SB','TC','BJ'];
const ACC_NAMES_DEFAULT = { MA:'Manish', SA:'Suresh', SB:'Subhita', TC:'Tushar', BJ:'Bhojraj' };
const WORKER_URL = 'https://mezvontransport.manishchoudhary1094.workers.dev/';

let appData = null;
let currentAcc = null;
let selectedVehicle = {};
let editingVehicleIndex = null;

function setStatus(text, online){
  document.getElementById('statusText').textContent = text;
  document.getElementById('statusDot').className = 'status-dot' + (online ? '' : ' offline');
}

// ── Home page navigation ──────────────────────────────────────────────
function showHome(){
  document.getElementById('homeView').style.display = 'block';
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
}

function showSection(name){
  document.getElementById('homeView').style.display = 'none';
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === 'section-' + name));
  if(name === 'vehicles') renderVehicleInfo();
}

function toggleRangeFields(){
  const checked = document.getElementById('customRange').checked;
  document.getElementById('rangeFields').classList.toggle('show', checked);
  document.getElementById('rangeErr').classList.remove('show');
}

function formatDateForScrape(yyyyMmDd){
  const [y,m,d] = yyyyMmDd.split('-');
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d}-${months[parseInt(m,10)-1]}-${y}`;
}

async function triggerUpdate(){
  if(!confirm('Would you like to proceed?')) return;

  const btn = document.getElementById('updateBtn');
  const checked = document.getElementById('customRange').checked;
  let body = {};

  if(checked){
    const from = document.getElementById('fromDate').value;
    const to = document.getElementById('toDate').value;
    if(!from || !to){
      document.getElementById('rangeErr').classList.add('show');
      return;
    }
    document.getElementById('rangeErr').classList.remove('show');
    body = { from_date: formatDateForScrape(from), to_date: formatDateForScrape(to) };
  }

  btn.disabled = true;
  btn.textContent = '⏳ Updating...';
  try{
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error('Trigger failed');
    setStatus('Update shuru ho gaya — kuch minute mein naya data aayega', true);
    let attempts = 0;
    const poll = setInterval(async () => {
      attempts++;
      await loadData();
      if(attempts >= 12) clearInterval(poll);
    }, 20000);
  } catch(e){
    alert('Update start nahi ho paaya: ' + e.message);
  } finally {
    setTimeout(()=>{ btn.disabled=false; btn.textContent='🔄 Update Now'; }, 8000);
  }
}

async function firebaseLogin(email, password){
  const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_API_KEY}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email, password, returnSecureToken:true})
  });
  if(!res.ok) throw new Error((await res.json()).error?.message || 'Login failed');
  return res.json();
}

// Silently exchange the long-lived refresh token for a fresh idToken.
async function refreshIdToken(){
  const refreshToken = localStorage.getItem('tci_refresh_token');
  if(!refreshToken) return null;
  const res = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FIREBASE_API_KEY}`, {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}`
  });
  if(!res.ok) return null;
  const data = await res.json();
  localStorage.setItem('tci_id_token', data.id_token);
  localStorage.setItem('tci_refresh_token', data.refresh_token);
  return data.id_token;
}

async function getValidIdToken(){
  let idToken = localStorage.getItem('tci_id_token');
  return idToken;
}

async function fetchData(idToken){
  const res = await fetch(`${FIREBASE_DB_URL}/tci_data.json?auth=${idToken}`);
  if(!res.ok) throw new Error('Fetch failed');
  return res.json();
}

// Writes the full vehicle_info array back to Firebase (doesn't touch trip_details/last_updated).
async function writeVehicleInfo(vehicles){
  let idToken = localStorage.getItem('tci_id_token');
  async function attempt(token){
    const res = await fetch(`${FIREBASE_DB_URL}/tci_data/vehicle_info.json?auth=${token}`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(vehicles)
    });
    if(!res.ok) throw new Error('Write failed');
    return res.json();
  }
  try{
    await attempt(idToken);
  } catch(e){
    const newToken = await refreshIdToken();
    if(!newToken) throw e;
    await attempt(newToken);
  }
}

function accKeysAndNames(data){
  const names = data?.account_names || {};
  const keys = Object.keys(names).length ? Object.keys(names) : ACC_KEYS_DEFAULT;
  const fullNames = {};
  keys.forEach(k => { fullNames[k] = names[k] || ACC_NAMES_DEFAULT[k] || k; });
  return { keys, names: fullNames };
}

function fmt(n){ return (n||0).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}); }

function render(data){
  appData = data;
  if(!data){
    document.getElementById('trip-table-wrap').innerHTML = '<div class="empty">Abhi tak koi data nahi hai. Laptop pe script chalao.</div>';
    document.getElementById('acc-tabs').innerHTML = '';
    return;
  }
  document.getElementById('statusText').innerHTML = 'Updated: ' + (data.last_updated || '—');

  const { keys, names } = accKeysAndNames(data);
  if(!currentAcc || !keys.includes(currentAcc)) currentAcc = keys[0];

  renderAccTabs(keys, names);
  renderTripTable(currentAcc, names);

  if(document.getElementById('section-vehicles').classList.contains('active')) renderVehicleInfo();
}

function renderAccTabs(keys, names){
  document.getElementById('acc-tabs').innerHTML = keys.map(k =>
    `<div class="acc-tab ${k===currentAcc?'active':''}" onclick="switchAcc('${k}')">${names[k]}</div>`
  ).join('');
}

function switchAcc(acc){
  currentAcc = acc;
  const { keys, names } = accKeysAndNames(appData);
  renderAccTabs(keys, names);
  renderTripTable(acc, names);
}

function renderTripTable(acc, names){
  const wrap = document.getElementById('trip-table-wrap');
  const trips = appData?.trip_details?.[acc] || [];

  if(!trips.length){
    wrap.innerHTML = `<div class="empty">${names[acc] || acc} ke liye koi data nahi hai.</div>`;
    return;
  }

  const byVehicle = {};
  trips.forEach(t => {
    const v = t.vehicle || 'Unknown';
    if(!byVehicle[v]) byVehicle[v] = [];
    byVehicle[v].push(t);
  });
  const vehicleNames = Object.keys(byVehicle).sort();

  const grand = {
    trips: trips.length,
    netLiability: trips.reduce((s,t)=>s+(t.net_liability||0),0),
    penalty: trips.reduce((s,t)=>s+(t.penalty||0),0),
  };

  if(!selectedVehicle[acc] || !vehicleNames.includes(selectedVehicle[acc])) selectedVehicle[acc] = vehicleNames[0];
  const activeVehicle = selectedVehicle[acc];

  const tabsHtml = vehicleNames.map(v => {
    const count = byVehicle[v].length;
    const isActive = v === activeVehicle;
    return `<div class="veh-tab ${isActive?'active':''}" onclick="selectVehicle('${acc}','${v}')">🚛 ${v} <span class="veh-tab-count">${count}</span></div>`;
  }).join('');

  wrap.innerHTML = `
    <div class="grand-summary">
      <span><b>${vehicleNames.length}</b> vehicles</span>
      <span><b>${grand.trips}</b> total trips</span>
      <span>Net Liability: <b>₹${fmt(grand.netLiability)}</b></span>
      <span>Penalty Ded.: <b>₹${fmt(grand.penalty)}</b></span>
    </div>
    <div class="veh-tabs">${tabsHtml}</div>
    <div id="veh-table-area"></div>`;

  renderVehicleTripTable(acc, activeVehicle, byVehicle, names[acc] || acc);
}

function selectVehicle(acc, vehicle){
  selectedVehicle[acc] = vehicle;
  const trips = appData?.trip_details?.[acc] || [];
  const byVehicle = {};
  trips.forEach(t => {
    const v = t.vehicle || 'Unknown';
    if(!byVehicle[v]) byVehicle[v] = [];
    byVehicle[v].push(t);
  });
  document.querySelectorAll('.veh-tab').forEach(el => {
    el.classList.toggle('active', el.textContent.trim().startsWith('🚛 ' + vehicle));
  });
  const { names } = accKeysAndNames(appData);
  renderVehicleTripTable(acc, vehicle, byVehicle, names[acc] || acc);
}

function renderVehicleTripTable(acc, vehicle, byVehicle, accDisplayName){
  const area = document.getElementById('veh-table-area');
  if(!area || !byVehicle[vehicle]) return;

    gst: trips.reduce((s,t)=>s+(t.gst_amt||0),0),

    penalty: trips.reduce((s,t)=>s+(t.penalty||0),0),

        <th style="border:1px solid #ccc; padding:5px;">TCS No.</th>
        <th style="border:1px solid #ccc; padding:5px;">TCS Branch</th>
        <th style="border:1px solid #ccc; padding:5px;">TCS Date</th>
        <th style="border:1px solid #ccc; padding:5px;">TCS Dest</th>
        <th style="border:1px solid #ccc; padding:5px;">Close Date</th>
        <th style="border:1px solid #ccc; padding:5px; text-align:right;">Liability Amt</th>
        <th style="border:1px solid #ccc; padding:5px; text-align:right;">GST Amt</th>
        <th style="border:1px solid #ccc; padding:5px; text-align:right;">Net Liability</th>
        <th style="border:1px solid #ccc; padding:5px; text-align:right;">Penalty Ded.</th>
        <th style="border:1px solid #ccc; padding:5px; text-align:right;">Handling Amt</th>
        <th style="border:1px solid #ccc; padding:5px; text-align:right;">Early Payment Ded.</th>
        <th style="border:1px solid #ccc; padding:5px; text-align:right;">GPS Amt Ded.</th>
        <th style="border:1px solid #ccc; padding:5px; text-align:right;">TDS Ded.</th>
      </tr></thead>
      <tbody>
        ${trips.map((t,i) => `
        <tr>
          <td style="border:1px solid #ccc; padding:5px;">${i+1}</td>
          <td style="border:1px solid #ccc; padding:5px;">${t.tcs_no||'-'}</td>
          <td style="border:1px solid #ccc; padding:5px;">${t.tcs_branch||'-'}</td>
          <td style="border:1px solid #ccc; padding:5px;">${t.tcs_date||'-'}</td>

const VEHICLE_FIELDS = [
  {key:'account',          label:'Account'},
  {key:'vehicle_no',       label:'Vehicle No'},
  {key:'insurance',        label:'Insurance Expiry'},
  {key:'puc',              label:'PUC Expiry'},
  {key:'fitness',          label:'Fitness Expiry'},
  {key:'national_permit',  label:'National Permit Expiry'},
  {key:'permit',           label:'Permit Expiry'},
];
const DATE_FIELD_KEYS = ['insurance','puc','fitness','national_permit','permit'];

function expiryClass(dateStr){
  if(!dateStr) return '';
  try{
    const months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
    const parts = dateStr.split('-');
    if(parts.length !== 3) return '';
    const d = new Date(parseInt(parts[2]), months[parts[1].toLowerCase()], parseInt(parts[0]));
    const diff = Math.floor((d - new Date()) / 86400000);
    if(diff <= 3) return 'exp-red';
    if(diff <= 35) return 'exp-orange';
    return 'exp-green';
  } catch { return ''; }
}

function formatExpiry(dateStr){
  if(!dateStr || dateStr === 'NILL') return dateStr || '-';
  try{
    const months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
    const parts = dateStr.split('-');
    const d = new Date(parseInt(parts[2]), months[parts[1].toLowerCase()], parseInt(parts[0]));
    const diff = Math.floor((d - new Date()) / 86400000);
    const suffix = diff < 0 ? ` (${Math.abs(diff)}d ago)` : diff === 0 ? ' (Today!)' : ` (${diff}d)`;
    return dateStr + suffix;
  } catch { return dateStr; }
}

function renderVehicleInfo(){
  const vehicles = appData?.vehicle_info || [];
  const el = document.getElementById('vehicles-inner');

  let html = '<button class="add-vehicle-btn" onclick="openVehicleForm()">+ Add Vehicle</button>';

  if(!vehicles.length){
    html += '<div class="empty">Vehicle info nahi hai.</div>';
    el.innerHTML = html;
    return;
  }

  html += '<div class="card"><div class="table-scroll"><table class="vi-table"><thead><tr>' +
    VEHICLE_FIELDS.map(f=>`<th>${f.label}</th>`).join('') + '<th>Actions</th></tr></thead><tbody>';
  vehicles.forEach((v, idx) => {
    html += '<tr>' + VEHICLE_FIELDS.map(f=>{
      const val = v[f.key];
      if(DATE_FIELD_KEYS.includes(f.key)){
        return `<td class="${expiryClass(val)}">${formatExpiry(val)}</td>`;
      }
      return `<td>${val ?? '-'}</td>`;
    }).join('');
    html += `<td><div class="vi-actions">
        <button class="icon-btn" onclick="openVehicleForm(${idx})">✏️</button>
        <button class="icon-btn" onclick="confirmDeleteVehicle(${idx})">🗑️</button>
      </div></td></tr>`;
  });
  html += '</tbody></table></div></div>';
  el.innerHTML = html;
}

// ── Add / Edit vehicle form ───────────────────────────────────────────
function openVehicleForm(idx){
  editingVehicleIndex = (typeof idx === 'number') ? idx : null;
  const vehicles = appData?.vehicle_info || [];
  const existing = editingVehicleIndex !== null ? vehicles[editingVehicleIndex] : {};

  document.getElementById('vehicleModalTitle').textContent = editingVehicleIndex !== null ? 'Edit Vehicle' : 'Add Vehicle';
  document.getElementById('vehicleFormFields').innerHTML = VEHICLE_FIELDS.map(f => `
    <label>${f.label}</label>
    <input type="text" id="vf_${f.key}" value="${existing[f.key] ?? ''}" placeholder="${DATE_FIELD_KEYS.includes(f.key) ? 'DD-Mon-YYYY' : ''}">
  `).join('');

  document.getElementById('vehicleModal').classList.add('active');
}

function closeVehicleForm(){
  document.getElementById('vehicleModal').classList.remove('active');
  editingVehicleIndex = null;
}

async function saveVehicle(){
  const entry = {};
  VEHICLE_FIELDS.forEach(f => {
    entry[f.key] = document.getElementById(`vf_${f.key}`).value.trim();
  });

  const vehicles = [...(appData?.vehicle_info || [])];
  if(editingVehicleIndex !== null){
    vehicles[editingVehicleIndex] = entry;
  } else {
    vehicles.push(entry);
  }

  try{
    await writeVehicleInfo(vehicles);
    appData.vehicle_info = vehicles;
    localStorage.setItem(CACHE_KEY, JSON.stringify(appData));
    closeVehicleForm();
    renderVehicleInfo();
  } catch(e){
    alert('Save fail hua, phir se try karo. (' + e.message + ')');
  }
}

function confirmDeleteVehicle(idx){
  const vehicles = appData?.vehicle_info || [];
  const v = vehicles[idx];
  if(!confirm(`Pakka delete karna hai? (${v?.vehicle_no || 'Vehicle'})`)) return;
  deleteVehicle(idx);
}

async function deleteVehicle(idx){
  const vehicles = [...(appData?.vehicle_info || [])];
  vehicles.splice(idx, 1);
  try{
    await writeVehicleInfo(vehicles);
    appData.vehicle_info = vehicles;
    localStorage.setItem(CACHE_KEY, JSON.stringify(appData));
    renderVehicleInfo();
  } catch(e){
    alert('Delete fail hua, phir se try karo. (' + e.message + ')');
  }
}

async function loadData(){
  let idToken = localStorage.getItem('tci_id_token');
  if(!idToken){ showLogin(); return; }
  try{
    const data = await fetchData(idToken);
    if(data) localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    setStatus('Updated: ' + (data?.last_updated || '—'), true);
    render(data);
  } catch(e){
    try{
      const newToken = await refreshIdToken();
      if(newToken){
        const data = await fetchData(newToken);
        if(data) localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        setStatus('Updated: ' + (data?.last_updated || '—'), true);
        render(data);
        return;
      }
    } catch(e2){ /* fall through to offline/cache below */ }

    const cached = localStorage.getItem(CACHE_KEY);
    if(cached){
      const data = JSON.parse(cached);
      setStatus('Offline (' + (data.last_updated || '—') + ')', false);
      render(data);
    } else {
      setStatus('Offline — no cached data', false);
      render(null);
    }
  }
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const msg = document.getElementById('loginMsg');
  msg.textContent = 'Signing in...';
  try{
    const res = await firebaseLogin(email, pass);
    localStorage.setItem('tci_id_token', res.idToken);
    localStorage.setItem('tci_refresh_token', res.refreshToken);
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dataView').style.display = 'block';
    loadData();
  } catch(e){
    msg.textContent = e.message;
  }
}

function showLogin(){
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('dataView').style.display = 'none';
  setStatus('Please sign in', false);
}

(function(){
  const idToken = localStorage.getItem('tci_id_token');
  if(idToken){
    document.getElementById('dataView').style.display = 'block';
    loadData();
  } else {
    showLogin();
  }
})();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
