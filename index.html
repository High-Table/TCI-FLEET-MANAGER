<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>TCI Fleet Manager</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#0f1117; --card:#1a1d27; --border:#2a2d3a;
    --accent:#4f8ef7; --accent2:#7c3aed; --green:#22c55e;
    --yellow:#eab308; --red:#ef4444; --text:#e2e8f0; --muted:#94a3b8;
    --header-h:56px;
  }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  header { position:fixed; top:0; left:0; right:0; height:var(--header-h); background:var(--card);
    border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 16px; z-index:100; gap:12px; }
  header h1 { font-size:1rem; font-weight:700; flex:1;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .status-bar { font-size:0.65rem; color:var(--muted); text-align:right; line-height:1.3; max-width:130px; }
  .status-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--green); margin-right:4px; }
  .status-dot.offline { background:var(--yellow); }
  .main { padding: calc(var(--header-h) + 12px) 12px 40px; max-width:1000px; margin:0 auto; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; }

  .tabs { display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tab { flex:0 0 auto; background:var(--card); border:1px solid var(--border); border-radius:8px;
    padding:8px 14px; font-size:0.8rem; cursor:pointer; white-space:nowrap; }
  .tab.active { border-color:var(--accent); background:var(--accent); color:#fff; }
  .section { display:none; }
  .section.active { display:block; }

  /* ── Account tabs (Manish/Suresh/etc) ── */
  .acc-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .acc-tab { background:var(--card); border:1px solid var(--border); border-radius:8px;
    padding:7px 14px; cursor:pointer; font-size:0.8rem; font-weight:600; }
  .acc-tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* ── Grand summary ── */
  .grand-summary { display:flex; gap:14px; flex-wrap:wrap; background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:12px 16px; margin-bottom:14px; font-size:0.78rem; color:var(--muted); }
  .grand-summary b { color:var(--text); font-size:0.88rem; }

  /* ── Vehicle tabs ── */
  .veh-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .veh-tab { background:var(--card); border:1px solid var(--border); border-radius:8px;
    padding:7px 12px; cursor:pointer; font-size:0.78rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  .veh-tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .veh-tab-count { background:rgba(255,255,255,0.15); border-radius:20px; padding:1px 7px; font-size:0.68rem; font-weight:700; }
  .veh-tab.active .veh-tab-count { background:rgba(255,255,255,0.25); }

  .vehicle-section { margin-bottom:16px; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--card); }
  .vehicle-header { display:flex; justify-content:space-between; align-items:center; padding:10px 14px;
    background:#1e2133; border-bottom:1px solid var(--border); }
  .vehicle-name { font-weight:700; font-size:0.88rem; }
  .vehicle-trip-count { background:rgba(79,142,247,0.15); color:var(--accent); border-radius:20px;
    padding:2px 10px; font-weight:700; font-size:0.72rem; }

  /* Table always scrolls horizontally - same as laptop dashboard */
  .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .trip-table { width:100%; border-collapse:collapse; font-size:0.72rem; }
  .trip-table th { background:#171a29; padding:7px 8px; text-align:left; font-size:0.6rem;
    letter-spacing:0.02em; text-transform:uppercase; color:var(--muted); white-space:nowrap; border-bottom:1px solid var(--border); }
  .trip-table td { padding:7px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .trip-table tr:last-child td { border-bottom:none; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .total-row td { background:rgba(79,142,247,0.08); font-weight:700; border-top:1px solid var(--border); }

  .vi-table { width:100%; border-collapse:collapse; font-size:0.75rem; }
  .vi-table th { background:#171a29; padding:7px 8px; text-align:left; font-size:0.62rem;
    text-transform:uppercase; color:var(--muted); white-space:nowrap; border-bottom:1px solid var(--border); }
  .vi-table td { padding:7px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }

  .login-box { max-width:340px; margin:30vh auto 0; padding:24px; }
  .login-box input { width:100%; padding:10px 12px; margin-bottom:10px; background:#11141c;
    border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:0.9rem; }
  .login-box button { width:100%; padding:10px; border:none; border-radius:8px; font-weight:600;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; cursor:pointer; }
  .msg { font-size:0.75rem; color:var(--muted); margin-top:8px; text-align:center; }
  .empty { color:var(--muted); font-size:0.85rem; text-align:center; padding:30px 10px; }
</style>
</head>
<body>

<header>
  <h1>TCI Fleet Manager</h1>
  <div class="status-bar" id="statusBar"><span class="status-dot" id="statusDot"></span><span id="statusText">Loading...</span></div>
</header>

<div class="main">
  <!-- Login (one-time) -->
  <div id="loginBox" class="login-box card" style="display:none;">
    <div style="font-weight:700; margin-bottom:14px;">Sign in</div>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="doLogin()">Login</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- Data view -->
  <div id="dataView" style="display:none;">
    <div class="tabs">
      <div class="tab active" data-tab="trips" onclick="switchTab('trips')">Trip Details</div>
      <div class="tab" data-tab="vehicles" onclick="switchTab('vehicles')">Vehicle Info</div>
    </div>

    <div id="section-trips" class="section active">
      <div class="acc-tabs" id="acc-tabs"></div>
      <div id="trip-table-wrap"></div>
    </div>
    <div id="section-vehicles" class="section"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
const CACHE_KEY = 'tci_cached_data';
const ACC_KEYS_DEFAULT = ['MA','SA','SB','TC','BJ'];
const ACC_NAMES_DEFAULT = { MA:'Manish', SA:'Suresh', SB:'Subhita', TC:'Tushar', BJ:'Bhojraj' };

let appData = null;
let currentAcc = null;
let selectedVehicle = {};

function setStatus(text, online){
  document.getElementById('statusText').textContent = text;
  document.getElementById('statusDot').className = 'status-dot' + (online ? '' : ' offline');
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active', s.id==='section-'+name));
  if(name === 'vehicles') renderVehicleInfo();
}

async function firebaseLogin(email, password){
  const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_API_KEY}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email, password, returnSecureToken:true})
  });
  if(!res.ok) throw new Error((await res.json()).error?.message || 'Login failed');
  return res.json();
}

async function fetchData(idToken){
  const res = await fetch(`${FIREBASE_DB_URL}/tci_data.json?auth=${idToken}`);
  if(!res.ok) throw new Error('Fetch failed');
  return res.json();
}

function accKeysAndNames(data){
  const names = data?.account_names || {};
  const keys = Object.keys(names).length ? Object.keys(names) : ACC_KEYS_DEFAULT;
  const fullNames = {};
  keys.forEach(k => { fullNames[k] = names[k] || ACC_NAMES_DEFAULT[k] || k; });
  return { keys, names: fullNames };
}

function fmt(n){ return (n||0).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}); }

function render(data){
  appData = data;
  if(!data){
    document.getElementById('trip-table-wrap').innerHTML = '<div class="empty">Abhi tak koi data nahi hai. Laptop pe script chalao.</div>';
    document.getElementById('acc-tabs').innerHTML = '';
    return;
  }
  document.getElementById('statusText').innerHTML = 'Updated: ' + (data.last_updated || '—');

  const { keys, names } = accKeysAndNames(data);
  if(!currentAcc || !keys.includes(currentAcc)) currentAcc = keys[0];

  renderAccTabs(keys, names);
  renderTripTable(currentAcc, names);

  if(document.getElementById('section-vehicles').classList.contains('active')) renderVehicleInfo();
}

function renderAccTabs(keys, names){
  document.getElementById('acc-tabs').innerHTML = keys.map(k =>
    `<div class="acc-tab ${k===currentAcc?'active':''}" onclick="switchAcc('${k}')">${names[k]}</div>`
  ).join('');
}

function switchAcc(acc){
  currentAcc = acc;
  const { keys, names } = accKeysAndNames(appData);
  renderAccTabs(keys, names);
  renderTripTable(acc, names);
}

function renderTripTable(acc, names){
  const wrap = document.getElementById('trip-table-wrap');
  const trips = appData?.trip_details?.[acc] || [];

  if(!trips.length){
    wrap.innerHTML = `<div class="empty">${names[acc] || acc} ke liye koi data nahi hai.</div>`;
    return;
  }

  const byVehicle = {};
  trips.forEach(t => {
    const v = t.vehicle || 'Unknown';
    if(!byVehicle[v]) byVehicle[v] = [];
    byVehicle[v].push(t);
  });
  const vehicleNames = Object.keys(byVehicle).sort();

  const grand = {
    trips: trips.length,
    netLiability: trips.reduce((s,t)=>s+(t.net_liability||0),0),
    penalty: trips.reduce((s,t)=>s+(t.penalty||0),0),
  };

  if(!selectedVehicle[acc] || !vehicleNames.includes(selectedVehicle[acc])) selectedVehicle[acc] = vehicleNames[0];
  const activeVehicle = selectedVehicle[acc];

  const tabsHtml = vehicleNames.map(v => {
    const count = byVehicle[v].length;
    const isActive = v === activeVehicle;
    return `<div class="veh-tab ${isActive?'active':''}" onclick="selectVehicle('${acc}','${v}')">🚛 ${v} <span class="veh-tab-count">${count}</span></div>`;
  }).join('');

  wrap.innerHTML = `
    <div class="grand-summary">
      <span><b>${vehicleNames.length}</b> vehicles</span>
      <span><b>${grand.trips}</b> total trips</span>
      <span>Net Liability: <b>₹${fmt(grand.netLiability)}</b></span>
      <span>Penalty Ded.: <b>₹${fmt(grand.penalty)}</b></span>
    </div>
    <div class="veh-tabs">${tabsHtml}</div>
    <div id="veh-table-area"></div>`;

  renderVehicleTripTable(acc, activeVehicle, byVehicle);
}

function selectVehicle(acc, vehicle){
  selectedVehicle[acc] = vehicle;
  const trips = appData?.trip_details?.[acc] || [];
  const byVehicle = {};
  trips.forEach(t => {
    const v = t.vehicle || 'Unknown';
    if(!byVehicle[v]) byVehicle[v] = [];
    byVehicle[v].push(t);
  });
  document.querySelectorAll('.veh-tab').forEach(el => {
    el.classList.toggle('active', el.textContent.trim().startsWith('🚛 ' + vehicle));
  });
  renderVehicleTripTable(acc, vehicle, byVehicle);
}

function renderVehicleTripTable(acc, vehicle, byVehicle){
  const area = document.getElementById('veh-table-area');
  if(!area || !byVehicle[vehicle]) return;

  const vTrips = [...byVehicle[vehicle]].sort((a,b)=>(a.tcs_date||'').localeCompare(b.tcs_date||''));
  const vTotal = {
    liability: vTrips.reduce((s,t)=>s+(t.liability||0),0),
    gst: vTrips.reduce((s,t)=>s+(t.gst_amt||0),0),
    netLiability: vTrips.reduce((s,t)=>s+(t.net_liability||0),0),
    penalty: vTrips.reduce((s,t)=>s+(t.penalty||0),0),
    handling: vTrips.reduce((s,t)=>s+(t.handling||0),0),
    early: vTrips.reduce((s,t)=>s+(t.early_ded||0),0),
    gps: vTrips.reduce((s,t)=>s+(t.gps_ded||0),0),
    tds: vTrips.reduce((s,t)=>s+(t.tds_ded||0),0),
  };

  area.innerHTML = `
  <div class="vehicle-section">
    <div class="vehicle-header">
      <span class="vehicle-name">🚛 ${vehicle}</span>
      <span class="vehicle-trip-count">${vTrips.length} trips</span>
    </div>
    <div class="table-scroll">
    <table class="trip-table">
      <thead><tr>
        <th>Sr No.</th><th>TCS No.</th><th>TCS Branch</th><th>TCS Date</th><th>TCS Dest</th><th>Close Date</th>
        <th class="num">Liability Amt</th><th class="num">GST Amt</th><th class="num">Net Liability</th>
        <th class="num">Penalty Ded.</th><th class="num">Handling Amt</th><th class="num">Early Payment Ded.</th>
        <th class="num">GPS Amt Ded.</th><th class="num">TDS Ded.</th>
      </tr></thead>
      <tbody>
        ${vTrips.map((t,i) => `
        <tr>
          <td>${i+1}</td><td>${t.tcs_no||'-'}</td><td>${t.tcs_branch||'-'}</td><td>${t.tcs_date||'-'}</td>
          <td>${t.tcs_dest||'-'}</td><td>${t.close_date||'-'}</td>
          <td class="num">₹${fmt(t.liability)}</td><td class="num">₹${fmt(t.gst_amt)}</td>
          <td class="num">₹${fmt(t.net_liability)}</td>
          <td class="num">${t.penalty?'₹'+fmt(t.penalty):'-'}</td>
          <td class="num">${t.handling?'₹'+fmt(t.handling):'-'}</td>
          <td class="num">${t.early_ded?'₹'+fmt(t.early_ded):'-'}</td>
          <td class="num">${t.gps_ded?'₹'+fmt(t.gps_ded):'-'}</td>
          <td class="num">${t.tds_ded?'₹'+fmt(t.tds_ded):'-'}</td>
        </tr>`).join('')}
      </tbody>
      <tfoot>
        <tr class="total-row">
          <td colspan="6">TOTAL</td>
          <td class="num">₹${fmt(vTotal.liability)}</td>
          <td class="num">₹${fmt(vTotal.gst)}</td>
          <td class="num">₹${fmt(vTotal.netLiability)}</td>
          <td class="num">₹${fmt(vTotal.penalty)}</td>
          <td class="num">₹${fmt(vTotal.handling)}</td>
          <td class="num">₹${fmt(vTotal.early)}</td>
          <td class="num">₹${fmt(vTotal.gps)}</td>
          <td class="num">₹${fmt(vTotal.tds)}</td>
        </tr>
      </tfoot>
    </table>
    </div>
  </div>`;
}

function renderVehicleInfo(){
  const vehicles = appData?.vehicle_info || [];
  const el = document.getElementById('section-vehicles');
  if(!vehicles.length){
    el.innerHTML = '<div class="empty">Vehicle info nahi hai.</div>';
    return;
  }
  const headers = Object.keys(vehicles[0]);
  let html = '<div class="card"><div class="table-scroll"><table class="vi-table"><thead><tr>' +
    headers.map(h=>`<th>${h}</th>`).join('') + '</tr></thead><tbody>';
  for(const v of vehicles){
    html += '<tr>' + headers.map(h=>`<td>${v[h] ?? ''}</td>`).join('') + '</tr>';
  }
  html += '</tbody></table></div></div>';
  el.innerHTML = html;
}

async function loadData(){
  const idToken = localStorage.getItem('tci_id_token');
  if(!idToken){ showLogin(); return; }
  try{
    const data = await fetchData(idToken);
    if(data) localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    setStatus('Updated: ' + (data?.last_updated || '—'), true);
    render(data);
  } catch(e){
    const cached = localStorage.getItem(CACHE_KEY);
    if(cached){
      const data = JSON.parse(cached);
      setStatus('Offline (' + (data.last_updated || '—') + ')', false);
      render(data);
    } else {
      setStatus('Offline — no cached data', false);
      render(null);
    }
  }
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const msg = document.getElementById('loginMsg');
  msg.textContent = 'Signing in...';
  try{
    const res = await firebaseLogin(email, pass);
    localStorage.setItem('tci_id_token', res.idToken);
    localStorage.setItem('tci_refresh_token', res.refreshToken);
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dataView').style.display = 'block';
    loadData();
  } catch(e){
    msg.textContent = e.message;
  }
}

function showLogin(){
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('dataView').style.display = 'none';
  setStatus('Please sign in', false);
}

(function(){
  const idToken = localStorage.getItem('tci_id_token');
  if(idToken){
    document.getElementById('dataView').style.display = 'block';
    loadData();
  } else {
    showLogin();
  }
})();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
